name: 配置校验

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验配置与规则集
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: 检查规则语法、策略引用和优先级
        run: python3 scripts/validate.py
